services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Versioned tag forces Hostinger's GitHub deployment to build this source
    # instead of silently reusing an older local `latest` image.
    image: charcha-backend:signal-replay-v1
    container_name: charcha-backend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3003}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: "${MONGO_URL:?MONGO_URL is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      TURN_HOST: "${TURN_HOST:-charcha.loan-master.cloud}"
      TURN_SECRET: "${TURN_SECRET:?TURN_SECRET is required}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY is required}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-Charcha <onboarding@resend.dev>}"
      ANDROID_LATEST_VERSION_CODE: "${ANDROID_LATEST_VERSION_CODE:-3}"
      ANDROID_MIN_VERSION_CODE: "${ANDROID_MIN_VERSION_CODE:-3}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  turn:
    image: coturn/coturn:4.15.0-r0-alpine
    container_name: charcha-turn
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --realm=${TURN_HOST:-charcha.loan-master.cloud}
      - --external-ip=${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --stale-nonce
      - --no-multicast-peers
